<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TyLove Trading — 短炒分析</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:#0b1020;color:#e6ebff;font-family:-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif}
  .card{background:#141a30;border:1px solid #222c4d;border-radius:14px}
  .pos{color:#34d399}.neg{color:#f87171}
  .tag{border-radius:6px;padding:1px 7px;font-size:11px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #1e2743;font-size:13px;white-space:nowrap}
  th{color:#8ea0c9;font-weight:500;font-size:12px}
  .scroll{overflow-x:auto}
</style>
</head>
<body class="p-4 md:p-8">
<div class="max-w-6xl mx-auto">

  <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
    <div>
      <h1 class="text-2xl font-semibold">TyLove Trading</h1>
      <p class="text-sm text-slate-400">短炒分析系統 · 買入由你本人執行</p>
    </div>
    <div class="flex gap-2">
      <button onclick="act('/api/scan','掃描已開始')" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm">立即掃描</button>
      <button onclick="act('/api/monitor','持倉已更新')" class="px-4 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-sm">更新持倉</button>
    </div>
  </div>

  <div id="banner" class="hidden card p-3 mb-4 text-sm"></div>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
    <div class="card p-4"><div class="text-xs text-slate-400">上次掃描</div><div id="lastScan" class="text-sm mt-1">—</div></div>
    <div class="card p-4"><div class="text-xs text-slate-400">達標股票</div><div id="nSignals" class="text-xl mt-1">0</div></div>
    <div class="card p-4"><div class="text-xs text-slate-400">持倉中</div><div id="nPos" class="text-xl mt-1">0</div></div>
    <div class="card p-4"><div class="text-xs text-slate-400">累積勝率</div><div id="winRate" class="text-xl mt-1">—</div></div>
  </div>

  <div id="allowBox" class="hidden card p-3 mb-6 text-sm"></div>

  <h2 class="text-lg font-semibold mb-3">📌 今日訊號（含止蝕止賺）</h2>
  <div id="signals" class="space-y-3 mb-8"></div>

  <h2 class="text-lg font-semibold mb-3">💼 持倉監控</h2>
  <div id="positions" class="mb-8"></div>

  <h2 class="text-lg font-semibold mb-3">📊 全部股票評分</h2>
  <div class="card scroll mb-8">
    <table><thead><tr>
      <th>代號</th><th>名稱</th><th>總分</th><th>技術</th><th>現價</th>
      <th>RSI</th><th>ATR%</th><th>量比</th><th>狀態</th>
    </tr></thead><tbody id="allBody"></tbody></table>
  </div>

  <h2 class="text-lg font-semibold mb-3">🚫 新聞否決</h2>
  <div id="vetoed" class="card p-4 mb-8 text-sm text-slate-400">載入中…</div>

  <h2 class="text-lg font-semibold mb-3">📰 新聞動態（近 48 小時）</h2>
  <div id="newsBox" class="mb-10"></div>

  <p class="text-xs text-slate-500 pb-10">
    本工具只提供分析，不代客下單。所有買賣決定由使用者本人執行。
    訊號僅供參考，投資涉及風險。
  </p>
</div>

<script>
const $ = id => document.getElementById(id);
function banner(msg, ok=true){
  const b=$('banner'); b.className='card p-3 mb-4 text-sm '+(ok?'text-emerald-300':'text-rose-300');
  b.textContent=msg; b.classList.remove('hidden'); setTimeout(()=>b.classList.add('hidden'),3500);
}
async function act(url,msg){
  banner(msg);
  await fetch(url,{method:'POST'});
  setTimeout(load, 4000);
}
function cls(v){return v>=70?'tag bg-emerald-900 text-emerald-300':v>=55?'tag bg-amber-900 text-amber-300':'tag bg-slate-800 text-slate-400';}

function signalCard(s){
  const p=s.plan||{}, n=s.news||{};
  const notes=(s.notes||[]).filter(x=>x.includes('+')).slice(0,4).join(' · ');
  return `<div class="card p-4">
    <div class="flex justify-between items-start mb-3">
      <div><span class="font-semibold text-lg">${s.symbol}</span> <span class="text-slate-400">${s.name||''}</span>
        ${s.intraday?`<div class="text-xs text-slate-500 mt-1">${s.intraday}</div>`:''}</div>
      <div class="text-right"><div class="text-2xl font-semibold ${s.total_score>=75?'pos':''}">${s.total_score}</div>
        <div class="text-xs text-slate-500">技術 ${s.technical_score}　新聞 ${s.news_penalty>=0?'−'+s.news_penalty:'+'+(-s.news_penalty)}</div></div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-sm mb-3">
      <div><div class="text-xs text-slate-500">入場</div><div>${p.entry??'—'}</div></div>
      <div><div class="text-xs text-slate-500">止蝕</div><div class="neg">${p.stop_loss??'—'} (${p.stop_pct??''}%)</div></div>
      <div><div class="text-xs text-slate-500">目標一（減半）</div><div class="pos">${p.target1??'—'} (${p.target1_pct??''}%)</div></div>
      <div><div class="text-xs text-slate-500">目標二（清倉）</div><div class="pos">${p.target2??'—'} (${p.target2_pct??''}%)</div></div>
    </div>
    <div class="text-xs text-slate-400 mb-2">建議注碼 <b class="text-slate-200">${p.shares??0} 股</b>
      · 約 HK$${(p.capital_used||0).toLocaleString()} · 最大虧損 HK$${(p.max_loss_hkd||0).toLocaleString()}
      · 風險回報比 ${p.rr_ratio??'—'}</div>
    ${n.catalyst?`<div class="text-xs text-indigo-300 mb-1">催化劑：${n.catalyst}</div>`:''}
    ${n.reason?`<div class="text-xs text-slate-500 mb-1">新聞：${n.reason}</div>`:''}
    ${notes?`<div class="text-xs text-slate-500">${notes}</div>`:''}
  </div>`;
}

function posCard(p){
  const icon={EXIT:'🔴',TRIM:'🟡',WATCH:'🟠',HOLD:'🟢'}[p.action]||'⚪';
  return `<div class="card p-4 mb-3">
    <div class="flex justify-between"><div class="font-semibold">${icon} ${p.symbol} ${p.name||''}</div>
      <div class="${p.pnl_pct>=0?'pos':'neg'} font-semibold">${p.pnl_pct>=0?'+':''}${p.pnl_pct}%　HK$${(p.pnl_hkd||0).toLocaleString()}</div></div>
    <div class="text-xs text-slate-400 mt-2">入場 ${p.entry} → 現價 ${p.price}　|　止蝕 ${p.stop_loss} (距 ${p.dist_to_stop_pct}%) ${p.stop_moved?'↑已上移':''}　|　目標一 ${p.target1} (距 ${p.dist_to_target1_pct}%)</div>
    <div class="text-sm mt-2">建議：<b>${p.action}</b> — ${p.reason}</div>
  </div>`;
}

async function load(){
  const r = await fetch('/api/state'); const d = await r.json();
  $('lastScan').textContent = d.last_scan || '尚未掃描';
  $('nSignals').textContent = (d.signals||[]).length;
  $('nPos').textContent = (d.open_positions||[]).length;
  const st = d.stats||{};
  $('winRate').textContent = st.trades ? st.win_rate+'% ('+st.trades+'筆)' : '—';

  const a = d.allow_new||{};
  const ab=$('allowBox');
  if(a.reason){ ab.textContent='📋 倉位提示：'+a.reason; ab.classList.remove('hidden'); }
  else ab.classList.add('hidden');

  $('signals').innerHTML = (d.signals||[]).length
    ? d.signals.map(signalCard).join('')
    : '<div class="card p-4 text-sm text-slate-400">今日暫無股票達到入場門檻。寧願唔做，都好過亂做。</div>';

  $('positions').innerHTML = (d.positions||[]).length
    ? d.positions.map(posCard).join('')
    : '<div class="card p-4 text-sm text-slate-400">手上沒有持倉。</div>';

  $('allBody').innerHTML = (d.all||[]).map(s=>{
    const sn=s.snapshot||{};
    return `<tr><td>${s.symbol}</td><td>${s.name||''}</td>
      <td><span class="${cls(s.total_score)}">${s.total_score}</span></td>
      <td>${s.technical_score}</td><td>${s.price}</td>
      <td>${(sn.rsi||0).toFixed(0)}</td><td>${(sn.atr_pct||0).toFixed(1)}%</td>
      <td>${(sn.vol_ratio||0).toFixed(1)}x</td>
      <td>${s.veto?'<span class="tag bg-rose-900 text-rose-300">否決</span>':(s.pass_filter?'<span class="tag bg-emerald-900 text-emerald-300">通過</span>':'<span class="tag bg-slate-800 text-slate-400">'+s.filter_reason+'</span>')}</td></tr>`;
  }).join('');

  $('vetoed').innerHTML = (d.vetoed||[]).length
    ? d.vetoed.map(v=>`<div class="mb-2"><b>${v.symbol} ${v.name}</b> — ${(v.news||{}).reason||''}</div>`).join('')
    : '✅ 今日無股票觸發新聞否決（即無重大負面事件）';

  renderNews(d.all||[]);
}

function newsTag(n){
  if(n.veto) return ['重大負面','bg-rose-900 text-rose-300'];
  if(n.sentiment==='positive') return ['偏正面','bg-emerald-900 text-emerald-300'];
  if(n.sentiment==='negative') return ['偏負面','bg-amber-900 text-amber-300'];
  return ['中性','bg-slate-800 text-slate-400'];
}

function renderNews(rows){
  const box=$('newsBox');
  if(!rows.length){ box.innerHTML='<div class="card p-4 text-sm text-slate-400">尚未掃描。按右上角「立即掃描」開始。</div>'; return; }
  const withNews = rows.filter(s=>s.news && (((s.news.titles||[]).length>0) || s.news.reason));
  if(!withNews.length){ box.innerHTML='<div class="card p-4 text-sm text-slate-400">本次掃描嘅股票都未抓到相關新聞。</div>'; return; }
  box.innerHTML = withNews.map(s=>{
    const n=s.news||{}, t=newsTag(n), items=(n.titles||[]).slice(0,4);
    return `<div class="card p-4 mb-3">
      <div class="flex justify-between items-center mb-2">
        <div><span class="font-semibold">${s.symbol}</span> <span class="text-slate-400 text-sm">${s.name||''}</span></div>
        <span class="tag ${t[1]}">${t[0]}</span>
      </div>
      ${items.length
        ? `<ul class="text-sm text-slate-300 list-disc pl-5 space-y-1">${items.map(x=>`<li>${x}</li>`).join('')}</ul>`
        : '<div class="text-sm text-slate-400">近 48 小時無相關新聞</div>'}
      ${n.catalyst?`<div class="text-xs text-indigo-300 mt-2">催化劑：${n.catalyst}</div>`:''}
      ${n.reason?`<div class="text-xs text-slate-500 mt-1">判斷：${n.reason}</div>`:''}
    </div>`;
  }).join('');
}
load(); setInterval(load, 60000);
</script>
</body>
</html>
