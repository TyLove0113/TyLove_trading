name: keep-alive

# Railway 免費額度下服務會休眠，呢個 workflow 每 10 分鐘 ping 一次保持清醒。
# 設定：repo → Settings → Secrets → Actions 加一個 RAILWAY_URL
#       （例如 https://tylove-production.up.railway.app）

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          if [ -z "${{ secrets.RAILWAY_URL }}" ]; then
            echo "未設定 RAILWAY_URL，略過"
            exit 0
          fi
          curl -sS -m 30 "${{ secrets.RAILWAY_URL }}/api/health" || echo "ping 失敗（可能正在重啟）"
