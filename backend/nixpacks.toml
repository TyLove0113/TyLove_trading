# Railway 部署設定
#
# V4（2026-10-04）大幅簡化。
#
# 背景：之前用 rapidocr 做 OCR，佢依賴 opencv（GUI 版），連住
# libGL／libxcb／Qt 一整串系統庫。Railway 精簡容器永遠裝唔齊，
# 每次補完一個就爆下一個，造成長時間無法解決嘅 ImportError。
#
# V4 改為只用 tesseract（唔需要任何 GUI 系統庫），並喺程式碼加
# 「2 倍放大 + 自動對比」預處理。實測歷史圖由「漏 1 行、平倉價
# 4290.43 讀成 290.43」變成 4/4 全部正確。
#
# 所以呢個檔而家只需要裝 tesseract 本體。
[phases.setup]
aptPkgs = [
    "tesseract-ocr",
    "tesseract-ocr-eng",
]
